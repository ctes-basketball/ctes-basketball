<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>江翠國小籃球隊 數據紀錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Teko:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F2E9; --panel:#FFFFFF; --ink:#1C2420; --sub:#5B6660;
    --line:#E3DCCB; --court:#1F4A38; --court-2:#173627;
    --ball:#E2672A; --gold:#C8932B;
    --stage-bg:#DCEBE1; --stage-line:#B9D3C4;
    color-scheme: light dark;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141815; --panel:#1B211D; --ink:#EDEAE0; --sub:#9AA39C;
      --line:#2B332C; --court:#2E6B4E; --court-2:#265944;
      --ball:#F0824A; --gold:#E0B054;
      --stage-bg:#243A2E; --stage-line:#355845;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141815; --panel:#1B211D; --ink:#EDEAE0; --sub:#9AA39C;
    --line:#2B332C; --court:#2E6B4E; --court-2:#265944;
    --ball:#F0824A; --gold:#E0B054;
    --stage-bg:#243A2E; --stage-line:#355845;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Noto Sans TC', system-ui, -apple-system, sans-serif;
    line-height:1.5;
    -webkit-text-size-adjust:100%; text-size-adjust:100%;
  }
  .num{ font-family:'Teko', 'Noto Sans TC', sans-serif; font-weight:600; }

  header{
    background:#173627; padding-top:env(safe-area-inset-top,0px);
    position:relative; z-index:5;
  }
  .banner{ position:relative; container-type:inline-size; line-height:1; }
  .banner-img{ display:block; width:100%; height:auto; max-height:360px; object-fit:cover; object-position:center 22%; }

  .banner-bar{
    position:absolute; left:0; right:0; bottom:0; z-index:2;
    transform:translateY(50%);
  }
  .banner-bar-inner{
    max-width:920px; margin:0 auto; padding:0 10px;
    display:flex; justify-content:flex-end;
  }
  .site-title{
    position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden;
    clip:rect(0 0 0 0); white-space:nowrap; border:0;
  }
  nav{ display:flex; gap:5px; flex:0 0 auto; }
  nav button{
    appearance:none; border:1px solid rgba(255,255,255,.55); background:rgba(0,40,18,.65);
    -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
    color:#fff; font:inherit; font-weight:700; font-size:.88rem; line-height:1.2;
    padding:9px 13px; border-radius:999px; cursor:pointer; white-space:nowrap;
    transition:background .15s, color .15s;
  }
  nav button[aria-selected="true"]{ background:#fff; color:#1F4A38; border-color:var(--court-2); }
  @media (min-width:640px){
    .banner-bar-inner{ padding:0 16px; }
    nav{ gap:8px; }
    nav button{ font-size:1.1rem; padding:11px 26px; }
  }
  nav button:focus-visible{ outline:2px solid var(--ball); outline-offset:2px; }

  main{ max-width:920px; margin:0 auto; padding:46px 16px 60px; }
  section[hidden]{ display:none; }

  h2{ font-size:1.05rem; margin:0 0 14px; font-weight:700; }
  .hint{ color:var(--sub); font-size:.84rem; margin:-8px 0 16px; }
  .italic-note{ color:var(--sub); font-size:.85rem; font-style:italic; margin:-6px 0 18px; line-height:1.6; }
  .update-stamp{ color:var(--ball); font-size:.78rem; font-weight:700; margin:-10px 0 16px; }

  /* schedule */
  .sched-item{
    display:flex; gap:14px; align-items:flex-start; padding:14px 4px;
    border-bottom:1px solid var(--line);
  }
  .sched-item:last-child{ border-bottom:none; }
  .sched-date{
    flex:0 0 auto; min-width:64px; text-align:center; font-family:'Teko',sans-serif;
    font-size:1.5rem; font-weight:600; color:var(--court); line-height:1.05;
  }
  :root[data-theme="dark"] .sched-date, @media (prefers-color-scheme:dark){ .sched-date{color:var(--ball);} }
  .sched-date small{ display:block; font-family:'Noto Sans TC',sans-serif; font-size:.62rem; font-weight:500; color:var(--sub); }
  .sched-title{ font-weight:500; font-size:.95rem; }
  .clip-links{ display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:6px; }
  .game-note{ margin:-8px 0 18px; font-size:.8rem; color:var(--sub); font-style:italic; }
  .sched-note{ margin-top:6px; font-size:.76rem; color:var(--sub); font-style:italic; }
  .quarter-scores{ display:flex; flex-direction:column; gap:3px; margin-top:6px; }
  .quarter-scores span, .quarter-scores a{
    font-size:.76rem; padding:3px 10px; border-radius:8px; display:inline-block; width:fit-content;
    text-decoration:none;
  }
  .quarter-scores span{ color:var(--sub); background:rgba(0,0,0,.04); }
  .quarter-scores a{ color:var(--ball); background:rgba(226,103,42,.1); font-weight:700; line-height:1.5; }
  .quarter-scores a:hover{ text-decoration:underline; }
  .play-badge{
    display:inline-flex; align-items:center; gap:4px;
    font-size:.75rem; color:var(--ball); font-weight:700; text-decoration:none;
  }
  .play-badge:hover{ text-decoration:underline; }
  .year-group{ border-bottom:1px solid var(--line); }
  .year-group:last-child{ border-bottom:none; }
  .year-toggle{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    appearance:none; border:none; background:transparent; cursor:pointer;
    padding:14px 4px; font:inherit; font-size:.95rem; font-weight:700; color:var(--ink);
  }
  .year-toggle:focus-visible{ outline:2px solid var(--ball); outline-offset:2px; }
  .year-toggle .chevron{ color:var(--sub); transition:transform .15s; font-size:.8rem; }
  .year-toggle[aria-expanded="true"] .chevron{ transform:rotate(180deg); }
  .year-panel .sched-item:first-child{ border-top:1px solid var(--line); }
  .year-panel{ padding-bottom:4px; }
  .year-head{ display:flex; align-items:center; gap:10px; }
  .year-head .year-toggle.label{ width:auto; flex:0 0 auto; padding-right:0; }
  .year-head .year-toggle.fill{ flex:1; justify-content:flex-end; }
  .year-head .year-toggle[aria-expanded="true"] .chevron{ transform:rotate(180deg); }
  .event-link{ flex:0 0 auto; font-size:.8rem; font-weight:700; color:var(--ball); text-decoration:none; }
  .event-link:hover{ text-decoration:underline; }
  .stage-group{ margin-top:10px; }
  .stage-toggle{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    appearance:none; cursor:pointer; font:inherit; font-size:.9rem; font-weight:700; color:var(--ink);
    background:var(--stage-bg); border:1px solid var(--stage-line); border-radius:10px; padding:10px 14px;
  }
  .stage-toggle:focus-visible{ outline:2px solid var(--ball); outline-offset:2px; }
  .stage-toggle .chevron{ color:var(--sub); transition:transform .15s; font-size:.8rem; }
  .stage-toggle[aria-expanded="true"] .chevron{ transform:rotate(180deg); }
  .stage-toggle.sub{ background:var(--panel); border-color:var(--line); font-size:.85rem; padding:8px 12px; }
  .stage-group .stage-group{ margin-top:8px; }
  .stage-panel{ padding:4px 0 2px; }
  .stage-note{
    margin:10px 0 0; padding:12px 14px; border:1px solid var(--line); border-radius:10px;
    background:var(--panel); display:flex; flex-wrap:wrap; gap:14px; align-items:flex-start;
  }
  .stage-text{ flex:1 1 220px; font-size:.84rem; line-height:1.7; white-space:pre-line; color:var(--ink); }
  .stage-text strong{ display:block; font-size:.9rem; color:var(--court); }
  @media (prefers-color-scheme:dark){ .stage-text strong{ color:var(--ball); } }
  :root[data-theme="dark"] .stage-text strong{ color:var(--ball); }
  .stage-footer-wrap{ margin-top:12px; overflow-x:auto; border-radius:10px; border:1px solid var(--line); background:#fff; }
  .stage-footer-img{ width:100%; min-width:640px; height:auto; display:block; }
  .time-hl{ font-weight:900; color:var(--ball); }
  .stage-imgs{ flex:1 1 240px; display:flex; flex-direction:column; gap:10px; min-width:0; }
  .stage-imgs img{ width:100%; height:auto; border-radius:8px; border:1px solid var(--line); display:block; background:#fff; }
  .ann-group{ margin-top:14px; border:1px solid #F0C8AE; border-radius:12px; background:rgba(226,103,42,.08); overflow:hidden; }
  .ann-group .year-toggle.announce{ padding:14px 14px; color:var(--ball); }
  .ann-group .year-panel{ padding:0 14px 10px; }
  .ann-item{ display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-top:1px dashed #F0C8AE; }
  .ann-when{ flex:0 0 5.6em; text-align:center; font-size:.76rem; font-weight:900; color:#fff; background:var(--ball); border-radius:999px; padding:3px 0; }
  .ann-title{ font-weight:700; font-size:.92rem; }
  .ann-sub{ margin-top:2px; font-size:.78rem; color:var(--sub); }
  @media (prefers-color-scheme:dark){ .ann-group, .ann-item{ border-color:#5B3A28; } }
  :root[data-theme="dark"] .ann-group, :root[data-theme="dark"] .ann-item{ border-color:#5B3A28; }
  .venue-heading{
    font-size:.95rem; font-weight:900; color:var(--court); margin:16px 0 6px; padding:6px 10px;
    background:rgba(226,103,42,.1); border-left:4px solid var(--ball); border-radius:4px;
  }
  @media (prefers-color-scheme:dark){ .venue-heading{ color:var(--ball); } }
  :root[data-theme="dark"] .venue-heading{ color:var(--ball); }

  /* game data */
  .game-tabs{ display:flex; gap:8px; overflow-x:auto; margin-bottom:16px; padding-bottom:2px;}
  .game-tabs button{
    flex:0 0 auto; appearance:none; border:1px solid var(--line); background:var(--panel);
    color:var(--ink); font:inherit; font-size:.85rem; font-weight:700; padding:8px 14px;
    border-radius:999px; cursor:pointer;
  }
  .game-tabs button[aria-selected="true"]{ background:var(--ball); border-color:var(--ball); color:#fff; }

  .grade-tabs{ display:flex; gap:0; border-bottom:2px solid var(--line); margin-bottom:16px; }
  .grade-tabs button{
    appearance:none; border:none; background:transparent; color:var(--sub); font:inherit;
    font-size:.9rem; font-weight:700; padding:10px 18px; cursor:pointer; position:relative;
    margin-bottom:-2px; border-bottom:2px solid transparent;
  }
  .grade-tabs button[aria-selected="true"]{ color:var(--court); border-bottom-color:var(--court); }
  @media (prefers-color-scheme:dark){ .grade-tabs button[aria-selected="true"]{ color:var(--ball); border-bottom-color:var(--ball); } }
  :root[data-theme="dark"] .grade-tabs button[aria-selected="true"]{ color:var(--ball); border-bottom-color:var(--ball); }

  .session-block{ margin-bottom:22px; }
  .session-name{ font-weight:700; font-size:.92rem; margin:0 0 8px; color:var(--sub); }
  .table-wrap{ overflow-x:auto; overflow-y:visible; border:1px solid var(--line); border-radius:12px; background:var(--panel);}
  table{ border-collapse:collapse; width:100%; min-width:520px; font-size:.86rem; }
  thead th{
    text-align:center; font-weight:700; padding:9px 6px; background:var(--court); color:#fff;
    position:sticky; top:0; z-index:2;
  }
  thead th:first-child{ left:0; z-index:3; }
  thead th:first-child, tbody td:first-child{ text-align:left; padding-left:12px; }
  tbody td:first-child{ position:sticky; left:0; z-index:1; background:var(--panel); }
  tbody td{ text-align:center; padding:8px 6px; border-top:1px solid var(--line); }
  .grade-table.g-6 thead th{ background:#1F4A38; }
  .grade-table.g-5 thead th{ background:#1D7A6E; }
  .grade-table.g-4 thead th{ background:#5FA37B; }
  tbody tr:nth-child(even){ background:rgba(0,0,0,.02); }
  .dash{ color:var(--sub); }

  /* leaderboards */
  .scope-tabs{ display:flex; gap:8px; margin:0 0 14px; }
  .scope-tabs button{
    flex:1; appearance:none; cursor:pointer; font:inherit; text-align:center;
    background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:12px;
    padding:10px 8px; display:flex; flex-direction:column; gap:2px; align-items:center;
  }
  .scope-tabs button strong{ font-size:.95rem; font-weight:900; }
  .scope-tabs button small{ font-size:.68rem; color:var(--sub); font-weight:500; }
  .scope-tabs button[aria-selected="true"]{ background:var(--court); border-color:var(--court); color:#fff; }
  .scope-tabs button[aria-selected="true"] small{ color:rgba(255,255,255,.8); }
  .scope-tabs button:focus-visible{ outline:2px solid var(--ball); outline-offset:2px; }
  .scope-panel[hidden], .subpanel[hidden]{ display:none; }
  #ntContribNote{ white-space:pre-line; }
  .contrib-board{ padding:12px 16px 6px; }
  .contrib-head{ display:flex; justify-content:space-between; align-items:flex-end; font-weight:700; font-size:.95rem; margin-bottom:4px; }
  .contrib-head small{ font-weight:500; font-size:.72rem; color:var(--sub); }
  .contrib-list{ list-style:none; margin:0; padding:0; }
  .contrib-list li{ display:flex; align-items:center; gap:12px; padding:8px 0; border-top:1px solid var(--line); }
  .contrib-list li:first-child{ border-top:none; }
  .bf-rank{ width:1.5em; text-align:center; font-family:'Teko',sans-serif; font-weight:600; font-size:1.3rem; color:var(--ball); }
  .bf-main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .bf-name{ font-weight:700; font-size:.95rem; }
  .bf-name small{ margin-left:6px; font-weight:500; font-size:.7rem; color:var(--sub); }
  .bf-detail{ font-size:.74rem; color:var(--sub); }
  .bf-score{ font-family:'Teko',sans-serif; font-weight:600; font-size:1.5rem; color:var(--ball); }
  .board-grid{ display:flex; flex-direction:column; gap:10px; }
  .board{ background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .board-toggle{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    appearance:none; border:none; background:transparent; cursor:pointer;
    padding:14px 16px; font:inherit; font-size:.95rem; font-weight:700; color:var(--ink);
  }
  .board-toggle:focus-visible{ outline:2px solid var(--ball); outline-offset:-2px; }
  .board-toggle .ic{ font-size:1.05rem; margin-right:7px; }
  .board-toggle .chevron{ color:var(--sub); transition:transform .15s; font-size:.8rem; }
  .board-toggle[aria-expanded="true"] .chevron{ transform:rotate(180deg); }
  .board-panel{ padding:0 16px 12px; }
  .board ol{ list-style:none; margin:0; padding:0; }
  .board li{
    display:flex; align-items:baseline; gap:10px; padding:7px 0; border-top:1px solid var(--line);
  }
  .board li:first-child{ border-top:none; }
  .rank{ width:1.4em; text-align:right; font-family:'Teko',sans-serif; font-weight:600; font-size:1.1rem; color:var(--sub); }
  .rank.top{ color:var(--ball); }
  .pname{ flex:1; font-weight:500; font-size:.9rem; }
  .pval{ font-family:'Teko',sans-serif; font-weight:600; font-size:1.15rem; color:var(--court); }
  :root[data-theme="dark"] .pval, @media (prefers-color-scheme:dark){ .pval{color:var(--ball);} }
  .empty{ color:var(--sub); font-size:.85rem; padding:10px 0; }
  .note{ color:var(--sub); font-size:.78rem; margin:-10px 0 16px; }

  footer{ text-align:center; color:var(--sub); font-size:.78rem; padding:0 16px 24px; }
</style>
</head>

// ---------- tabs ----------
document.querySelectorAll('nav[role="tablist"] button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav[role="tablist"] button').forEach(b=>b.setAttribute('aria-selected', b===btn));
    document.querySelectorAll('main > section').forEach(s=> s.hidden = (s.id !== btn.dataset.tab));
    // 每次進入「球員表現」都回到尚未展開的初始畫面
    document.querySelectorAll('#scopeTabs button').forEach(b=>b.setAttribute('aria-selected','false'));
    document.querySelectorAll('.scope-panel').forEach(p=>p.hidden=true);
  });
});

// ---------- schedule ----------
function fmtDate(iso){
  const [y,m,d] = iso.split('-');
  return {md:`${parseInt(m)}/${parseInt(d)}`, y};
}
const ANNOUNCE = [
  {when:"10月", title:"挑選一個週末帶孩子爬山", sub:"（轉換環境達成訓練，採自願參加並邀請家長一起同樂）"},
  {when:"11月", title:"新埔盃邀請賽"},
  {when:"12月", title:"集美盃邀請賽"},
  {when:"12月期末", title:"聖誕禮物交換party"}
];
function announceHtml(){
  const items = ANNOUNCE.map(a=>`<div class="ann-item">
      <span class="ann-when">${a.when}</span>
      <div><div class="ann-title">${a.title}</div>${a.sub ? `<div class="ann-sub">${a.sub}</div>` : ''}</div>
    </div>`).join('');
  return `<div class="year-group ann-group">
    <button class="year-toggle announce" aria-expanded="false" aria-controls="ann-panel">
      <span>📣 活動預告</span><span class="chevron">▾</span>
    </button>
    <div class="year-panel" id="ann-panel" hidden>${items}</div>
  </div>`;
}
function renderSchedule(){
  const wrap = document.getElementById('scheduleList');
  const years = [...new Set(DATA.schedule.map(it=>it.year))];

  // group rows within a year: same date + same base title (ignoring trailing 節 label) merge into one row
  function groupYear(items){
    const groups = [];
    const index = {};
    items.forEach(it=>{
      const m = /^(.*?)\s*(第[^\s]+節)\s*$/.exec(it.title);
      const base = m ? m[1].trim() : it.title;
      const period = m ? m[2] : null;
      const key = it.date + '|' + base;
      if(!index[key]){
        index[key] = {date: it.date, title: base, clips: []};
        groups.push(index[key]);
      }
      index[key].clips.push({period, youtube: it.youtube});
    });
    return groups.sort((a,b)=> a.date.localeCompare(b.date));
  }

  function rowHtml(dateStr, titleHtml, clips, quarters, note){
    const {md,y} = fmtDate(dateStr);
    const links = (clips||[]).filter(c=>c.youtube).map(c=>
      `<a class="play-badge" href="${c.youtube}" target="_blank" rel="noopener">▶ ${c.period ? c.period : '觀看比賽影片'}</a>`
    ).join('');
    const quarterHtml = (quarters && quarters.length)
      ? `<div class="quarter-scores">${quarters.map(q=>{
          const lines = q.label.split('<br>').map(l=>`▶ ${l}`).join('<br>');
          return q.youtube
            ? `<a href="${q.youtube}" target="_blank" rel="noopener">${lines}</a>`
            : `<span>${lines}</span>`;
        }).join('')}</div>`
      : '';
    return `<div class="sched-item">
      <div class="sched-date">${md}<small>${y}</small></div>
      <div>
        <div class="sched-title">${titleHtml}</div>
        ${quarterHtml}
        ${note ? `<div class="sched-note">${note}</div>` : ''}
        ${links ? `<div class="clip-links">${links}</div>` : ''}
      </div>
    </div>`;
  }

  wrap.innerHTML = years.map((year, yi)=>{
    const items = DATA.schedule.filter(it=>it.year===year);
    const hasVenue = items.some(it=>it.venue);
    let rows;
    if(hasVenue){
      // list matches in original order, inserting a venue heading whenever it changes
      let lastVenue = null;
      const ex = (DATA.extras || {})[year];
      const buildRows = (arr)=>{
        let lastV = null;
        return arr.map(it=>{
          let venueHtml = '';
          if(it.venue && it.venue !== lastV){
            venueHtml = `<div class="venue-heading">📍 ${it.venue}</div>`;
            lastV = it.venue;
          }
          return venueHtml + rowHtml(it.date, it.title, it.youtube ? [{period:null, youtube:it.youtube}] : [], it.quarters, it.note);
        }).join('');
      };
      const matchRows = buildRows(items.filter(it=>it.stage !== '複賽'));
      const finMatchRows = buildRows(items.filter(it=>it.stage === '複賽'));
      const stage = (id, name, body, cls='')=> `<div class="stage-group">
        <button class="stage-toggle ${cls}" aria-expanded="false" aria-controls="${id}"><span>${name}</span><span class="chevron">▾</span></button>
        <div class="stage-panel" id="${id}" hidden>${body}</div>
      </div>`;
      let finalBody = '';
      if(ex && ex.notes && ex.notes.length){
        finalBody = ex.notes.map(n=>{
          const [first, ...rest] = n.text.split('\n');
          const ti = rest.findIndex(l=>l.startsWith('複賽比賽時間'));
          const restHtml = ti >= 0
            ? rest.slice(0, ti).join('\n') + (ti>0 ? '\n' : '') + `<span class="time-hl">${rest.slice(ti).join('\n')}</span>`
            : rest.join('\n');
          const imgs = (n.images||[]).map(k=>`<img src="${IMGS[k]}" alt="" loading="lazy">`).join('');
          return `<div class="stage-note"><div class="stage-text"><strong>${first}</strong>${restHtml}</div>${imgs ? `<div class="stage-imgs">${imgs}</div>` : ''}</div>`;
        }).join('');
      }
      if(finalBody){
        finalBody = stage(`stage-${yi}-ana`, '對戰分析', finalBody, 'sub') + finMatchRows;
      }
      rows = ex ? stage(`stage-${yi}-pre`, '預賽', matchRows) + (finalBody ? stage(`stage-${yi}-fin`, '複賽', finalBody) : '') : matchRows;
    } else {
      const groups = groupYear(items);
      rows = groups.map(g=> rowHtml(g.date, g.title, g.clips)).join('');
    }
    const panelId = `year-panel-${yi}`;
    const exLink = (DATA.extras || {})[year];
    if(exLink && exLink.link){
      return `<div class="year-group">
        <div class="year-head">
          <button class="year-toggle label" aria-expanded="false" aria-controls="${panelId}"><span>${year}</span></button>
          <a class="event-link" href="${exLink.link.url}" target="_blank" rel="noopener">🔗 ${exLink.link.label}</a>
          <button class="year-toggle fill" aria-expanded="false" aria-controls="${panelId}" aria-hidden="true" tabindex="-1"><span class="chevron">▾</span></button>
        </div>
        <div class="year-panel" id="${panelId}" hidden>${rows}</div>
      </div>`;
    }
    return `<div class="year-group">
      <button class="year-toggle" aria-expanded="false" aria-controls="${panelId}">
        <span>${year}</span><span class="chevron">▾</span>
      </button>
      <div class="year-panel" id="${panelId}" hidden>${rows}</div>
    </div>`;
  }).join('') + announceHtml();

  wrap.querySelectorAll('.year-toggle, .stage-toggle').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.getAttribute('aria-controls');
      const open = btn.getAttribute('aria-expanded') === 'true';
      wrap.querySelectorAll(`[aria-controls="${id}"]`).forEach(b=>b.setAttribute('aria-expanded', String(!open)));
      document.getElementById(id).hidden = open;
    });
  });
}

// ---------- game stats ----------
function statCell(v, suffix=''){
  return (v===null || v===undefined) ? '<span class="dash">–</span>' : `${v}${suffix}`;
}
function renderGameTabs(){
  const CATEGORIES = ["新北對抗賽","友誼賽","隊內練習賽"];
  const wrap = document.getElementById('categoryAccordion');
  wrap.innerHTML = CATEGORIES.map((cat, ci)=>{
    const games = DATA.games.filter(g=> g.category === cat);
    if(games.length===0) return '';
    const panelId = `cat-panel-${ci}`;
    const tabsHtml = games.map((g,gi)=>
      `<button data-cat="${ci}" data-gidx="${gi}" aria-selected="${gi===0}">${g.tabLabel || (g.date.slice(5).replace('-','/') + ' vs ' + g.opponent)}</button>`
    ).join('');
    return `<div class="year-group">
      <button class="year-toggle" aria-expanded="false" aria-controls="${panelId}">
        <span>${cat === '新北對抗賽' ? '115新北對抗賽' : cat}</span><span class="chevron">▾</span>
      </button>
      <div class="year-panel" id="${panelId}" hidden>
        <div class="game-tabs" id="cat-tabs-${ci}">${tabsHtml}</div>
        <div id="cat-content-${ci}"></div>
      </div>
    </div>`;
  }).join('');

  CATEGORIES.forEach((cat, ci)=>{
    const games = DATA.games.filter(g=> g.category === cat);
    if(games.length===0) return;
    const tabsEl = document.getElementById(`cat-tabs-${ci}`);
    tabsEl.querySelectorAll('button').forEach(b=>{
      b.addEventListener('click', ()=>{
        tabsEl.querySelectorAll('button').forEach(x=>x.setAttribute('aria-selected', x===b));
        renderGameContent(games[parseInt(b.dataset.gidx)], `cat-content-${ci}`);
      });
    });
    renderGameContent(games[0], `cat-content-${ci}`);
  });

  wrap.querySelectorAll('.year-toggle').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const open = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', String(!open));
      document.getElementById(btn.getAttribute('aria-controls')).hidden = open;
    });
  });
}
function renderGameContent(g, targetId){
  const el = document.getElementById(targetId);
  el.innerHTML = `<p class="hint">地點：${g.venue}</p>` + g.sessions.map(s=>`
    <div class="session-block">
      <p class="session-name">${s.name}</p>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>球員</th><th>得分</th><th>出手</th><th>籃板</th><th>抄截</th><th>助攻</th><th>阻攻</th><th>罰球</th>
          </tr></thead>
          <tbody>
            ${s.players.map(p=>`<tr>
              <td>${p.name}</td>
              <td>${statCell(p.pts)}</td>
              <td>${statCell(p.fg)}</td>
              <td>${statCell(p.reb)}</td>
              <td>${statCell(p.stl)}</td>
              <td>${statCell(p.ast)}</td>
              <td>${statCell(p.blk)}</td>
              <td>${statCell(p.ft)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `).join('') + (g.note ? `<p class="game-note">${g.note}</p>` : '');
}

// ---------- leaderboards ----------
function allPlayerRows(cat){
  const rows = [];
  DATA.games.filter(g=>!g.practice && (!cat || g.category===cat)).forEach(g=> g.sessions.forEach(s=> s.players.forEach(p=> rows.push({...p, _date: g.date}))));
  return rows;
}
function parseFrac(s){
  if(!s) return null;
  const m = /^(\d+)\s*\/\s*(\d+)$/.exec(s.trim());
  if(!m) return null;
  return {made:parseInt(m[1]), att:parseInt(m[2])};
}
function sumStat(key, cat){
  const totals = {};
  allPlayerRows(cat).forEach(p=>{
    const v = p[key];
    if(v===null || v===undefined) return;
    totals[p.name] = (totals[p.name]||0) + v;
  });
  return Object.entries(totals).sort((a,b)=> b[1]-a[1]).map(([name,val])=>({name,val}));
}
function ftLeaders(cat){
  const agg = {};
  allPlayerRows(cat).forEach(p=>{
    const f = parseFrac(p.ft);
    if(!f) return;
    if(!agg[p.name]) agg[p.name] = {made:0, att:0};
    agg[p.name].made += f.made;
    agg[p.name].att += f.att;
  });
  return Object.entries(agg)
    .filter(([,v])=> v.att>0)
    .map(([name,v])=>({name, pct: v.made/v.att*100, pctRound: Math.round(v.made/v.att*100), made:v.made, att:v.att}))
    .sort((a,b)=> b.pct - a.pct);
}
function renderBoard(icon, title, list, fmt, valKey, idx){
  let ranks = [];
  if(list.length){
    list.forEach((it,i)=>{
      if(i>0 && it[valKey] === list[i-1][valKey]) ranks.push(ranks[i-1]);
      else ranks.push(i+1);
    });
  }
  const panelId = `board-panel-${idx}`;
  const body = list.length===0
    ? `<p class="empty">目前尚無資料</p>`
    : `<ol>${list.map((it,i)=>`<li><span class="rank${ranks[i]===1?' top':''}">${ranks[i]}</span><span class="pname">${it.name}</span><span class="pval">${fmt(it)}</span></li>`).join('')}</ol>`;
  return `<div class="board">
    <button class="board-toggle" aria-expanded="false" aria-controls="${panelId}">
      <span><span class="ic">${icon}</span>${title}</span><span class="chevron">▾</span>
    </button>
    <div class="board-panel" id="${panelId}" hidden>${body}</div>
  </div>`;
}
function renderBoardSet(gridId, cat, prefix){
  const grid = document.getElementById(gridId);
  grid.innerHTML = [
    renderBoard('🏀','得分王', sumStat('pts',cat), it=>Math.round(it.val), 'val', prefix+0),
    renderBoard('🧲','籃板王', sumStat('reb',cat), it=>Math.round(it.val), 'val', prefix+1),
    renderBoard('🎯','助攻王', sumStat('ast',cat), it=>Math.round(it.val), 'val', prefix+2),
    renderBoard('🖐️','抄截王', sumStat('stl',cat), it=>Math.round(it.val), 'val', prefix+3),
    renderBoard('🚫','阻攻王', sumStat('blk',cat), it=>Math.round(it.val), 'val', prefix+4),
    renderBoard('🎁','罰球王', ftLeaders(cat), it=>`${it.pct.toFixed(0)}%`, 'pctRound', prefix+5),
  ].join('');
  grid.querySelectorAll('.board-toggle').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const open = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', String(!open));
      document.getElementById(btn.getAttribute('aria-controls')).hidden = open;
    });
  });
}
const NT = '新北對抗賽';
function renderLeaders(){
  renderBoardSet('boardGrid-all', undefined, 'a');
  renderBoardSet('boardGrid-nt', NT, 'n');
  renderContrib(NT);
}

// 綜合貢獻值＝得分＋籃板＋助攻＋抄截＋阻攻（累計）
function gradeOf(name){
  return Object.keys(GRADES).find(g=> GRADES[g].includes(name)) || '';
}
function scopeInfo(cat){
  const rows = allPlayerRows(cat);
  return {
    days: new Set(rows.map(r=>r._date)).size,
    games: DATA.games.filter(g=>!g.practice && g.category===cat).length
  };
}
function renderContrib(cat){
  const T = {};
  allPlayerRows(cat).forEach(p=>{
    const t = T[p.name] = T[p.name] || {name:p.name, pts:0, reb:0, ast:0, stl:0, blk:0, has:false};
    ['pts','reb','ast','stl','blk'].forEach(k=>{ t[k] += (p[k]||0); });
    if(['pts','reb','ast','stl','blk','fg','ft'].some(k=>p[k]!==null && p[k]!==undefined)) t.has = true;
  });
  const all = Object.values(T).filter(t=>t.has)
    .map(t=>({...t, score:t.pts+t.reb+t.ast+t.stl+t.blk}))
    .sort((a,b)=> b.score-a.score || b.pts-a.pts || b.reb-a.reb);
  const {days, games} = scopeInfo(cat);
  document.getElementById('ntScopeSub').textContent = `共${games}場比賽`;
  document.getElementById('ntContribNote').textContent =
    `※僅統計115新北對抗賽（${days}天、${games}場）的累計數據。\n※綜合貢獻值＝得分＋籃板＋助攻＋抄截＋阻攻。`;
  document.getElementById('ntRankNote').textContent =
    `※僅統計115新北對抗賽（${days}天、${games}場），依有比賽數據之場次做加總統計、僅列出有紀錄的球員。`;
  document.getElementById('ntGradeNote').textContent =
    `※僅統計115新北對抗賽（${days}天、${games}場）；依出場場次、名字第一字筆畫排序`;

  const detail = t=>`得分${t.pts}・籃板${t.reb}・助攻${t.ast}・抄截${t.stl}・阻攻${t.blk}`;

  // 完整排行榜：同分並列同名次
  const ranks = [];
  all.forEach((t,i)=> ranks.push(i>0 && t.score===all[i-1].score ? ranks[i-1] : i+1));
  document.getElementById('contribBoard').innerHTML = all.length ? `<div class="board contrib-board">
    <div class="contrib-head"><span>📊 綜合表現</span><small>綜合貢獻值</small></div>
    <ol class="contrib-list">${all.map((t,i)=>`<li>
      <span class="rank${ranks[i]===1?' top':''}">${ranks[i]}</span>
      <span class="bf-main"><span class="bf-name">${t.name}<small>${gradeOf(t.name)}</small></span><span class="bf-detail">${detail(t)}</span></span>
      <span class="pval">${t.score}</span>
    </li>`).join('')}</ol>
  </div>` : '';
}

renderSchedule();
renderGameTabs();
renderLeaders();
renderGradeTabs('all', undefined);
renderGradeTabs('nt', NT);

// ---------- 球員表現：第一層（所有比賽／115新北對抗賽）與第二層 ----------
document.querySelectorAll('#scopeTabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#scopeTabs button').forEach(b=>b.setAttribute('aria-selected', b===btn));
    document.querySelectorAll('.scope-panel').forEach(p=> p.hidden = (p.id !== 'scope-' + btn.dataset.scope));
  });
});
document.querySelectorAll('.game-tabs[data-sub]').forEach(group=>{
  group.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      group.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected', b===btn));
      group.parentElement.querySelectorAll('.subpanel').forEach(p=> p.hidden = (p.id !== btn.dataset.target));
    });
  });
});

// ---------- individual performance by grade ----------
function aggregatePlayer(name, cat){
  const rows = allPlayerRows(cat).filter(p=>p.name===name);
  const games = new Set(rows.map(p=>p._date)).size;
  const agg = {games, pts:0, reb:0, ast:0, stl:0, blk:0, ftMade:0, ftAtt:0,
               hasPts:false, hasReb:false, hasAst:false, hasStl:false, hasBlk:false};
  rows.forEach(p=>{
    if(p.pts!=null){ agg.pts += p.pts; agg.hasPts=true; }
    if(p.reb!=null){ agg.reb += p.reb; agg.hasReb=true; }
    if(p.ast!=null){ agg.ast += p.ast; agg.hasAst=true; }
    if(p.stl!=null){ agg.stl += p.stl; agg.hasStl=true; }
    if(p.blk!=null){ agg.blk += p.blk; agg.hasBlk=true; }
    const f = parseFrac(p.ft);
    if(f){ agg.ftMade += f.made; agg.ftAtt += f.att; }
  });
  return agg;
}
function renderGradeTabs(scope, cat){
  const tabWrap = document.getElementById('gradeTabs-' + scope);
  const names = Object.keys(GRADES);
  tabWrap.innerHTML = names.map((g,i)=> `<button data-grade="${g}" aria-selected="${i===0}">${g}</button>`).join('');
  tabWrap.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{
      tabWrap.querySelectorAll('button').forEach(x=>x.setAttribute('aria-selected', x===b));
      renderGradeContent(scope, cat, b.dataset.grade);
    });
  });
  renderGradeContent(scope, cat, names[0]);
}
function renderGradeContent(scope, cat, grade){
  const el = document.getElementById('gradeContent-' + scope);
  const roster = [...(GRADES[grade] || [])]
    .map(name=>({name, a: aggregatePlayer(name, cat)}))
    .sort((x,y)=> y.a.games - x.a.games || strokeOf(x.name) - strokeOf(y.name));
  const gradeClass = grade==="六年級" ? "g-6" : grade==="五年級" ? "g-5" : "g-4";
  el.innerHTML = `<div class="table-wrap">
    <table class="grade-table ${gradeClass}">
      <thead><tr>
        <th>球員</th><th>出賽場次</th><th>得分</th><th>籃板</th><th>抄截</th><th>助攻</th><th>阻攻</th><th>罰球</th>
      </tr></thead>
      <tbody>
        ${roster.map(({name,a})=>{
          const ft = a.ftAtt>0 ? `${a.ftMade}/${a.ftAtt}` : '<span class="dash">–</span>';
          return `<tr>
            <td>${name}</td>
            <td>${a.games}</td>
            <td>${a.hasPts? a.pts : '<span class="dash">–</span>'}</td>
            <td>${a.hasReb? a.reb : '<span class="dash">–</span>'}</td>
            <td>${a.hasStl? a.stl : '<span class="dash">–</span>'}</td>
            <td>${a.hasAst? a.ast : '<span class="dash">–</span>'}</td>
            <td>${a.hasBlk? a.blk : '<span class="dash">–</span>'}</td>
            <td>${ft}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}
